name: Set up project
description: Install the pinned Bun runtime and dependencies from the frozen lockfile.
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json
    - shell: bash
      run: bun install --frozen-lockfile
